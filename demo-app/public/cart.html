<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShopLite | Cart</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/app.js"></script>
</head>
<body>
  <header class="site"></header>
  <main>
    <h1>Your cart</h1>
    <div id="cart"></div>
  </main>
  <script>
    Shop.requireLogin();
    Shop.renderHeader();
    const el = document.getElementById('cart');

    async function render() {
      const cart = await Shop.api('/api/cart');
      if (cart.items.length === 0) {
        el.innerHTML = `<p>Your cart is empty.</p><p><a href="/inventory.html">Continue shopping</a></p>`;
        return;
      }
      el.innerHTML = `
        <table>
          <thead><tr><th scope="col">Product</th><th scope="col">Price</th><th scope="col">Qty</th><th scope="col">Total</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead>
          <tbody>
            ${cart.items.map((i) => `
              <tr>
                <td>${i.name}</td><td>${Shop.money(i.price)}</td><td>${i.quantity}</td><td>${Shop.money(i.lineTotal)}</td>
                <td><button type="button" class="secondary" data-remove="${i.productId}" aria-label="Remove ${i.name}">Remove</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
        <div class="summary">
          <p>Subtotal: <strong data-testid="subtotal">${Shop.money(cart.subtotal)}</strong></p>
          <p><a href="/inventory.html">Continue shopping</a> &nbsp; <a href="/checkout.html" class="button">Checkout</a></p>
        </div>`;
    }

    el.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-remove]');
      if (!btn) return;
      await Shop.api(`/api/cart/${btn.dataset.remove}`, { method: 'DELETE' });
      await Promise.all([render(), Shop.refreshCartCount()]);
    });
    render();
  </script>
</body>
</html>
