# Runs the demo app and the tests as separate containers, the way you would
# test a real deployed service. `docker compose up --exit-code-from tests`
services:
  app:
    image: node:22-slim
    working_dir: /app
    volumes: ['./:/app']
    command: sh -c "npm ci --omit=dev && node demo-app/server.js"
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      retries: 20
  tests:
    build: .
    depends_on:
      app: { condition: service_healthy }
    environment:
      BASE_URL: http://app:3000
    volumes: ['./playwright-report:/app/playwright-report']
